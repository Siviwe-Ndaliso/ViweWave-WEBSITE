<form id="enquiryForm">

    <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required minlength="3">
        <span class="error-message" id="nameError"></span>
    </div>

    <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
        <span class="error-message" id="emailError"></span>
    </div>

    <div class="form-group">
        <label for="enquiryType">Type of Enquiry</label>
        <select id="enquiryType" required>
            <option value="" disabled selected>Select what you are enquiring about...</option>
            <option value="stock">Album & Merch Stock Availability</option>
            <option value="sourcing">Custom Group Order Sourcing</option>
            <option value="volunteer">Volunteering for Fan Events</option>
        </select>
        <span class="error-message" id="typeError"></span>
    </div>

    <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" required>
        <span class="error-message" id="subjectError"></span>
    </div>

    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="6" placeholder="Type your enquiry here..." required minlength="10"></textarea>
        <span class="error-message" id="messageError"></span>
    </div>

    <button type="submit">Send Enquiry 🚀</button>

    <p id="successMessage" style="font-weight: bold; margin-top: 15px; text-align: center;"></p>

</form>
