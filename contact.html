<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ViweWave K-pop Store</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <meta name="description" content="Get in touch with ViweWave K-pop Store. Send us a general message or query regarding your orders and shop experience in South Africa.">
</head>

<body>

<header>
    <h1>Get In Touch 💖</h1>
    <nav>
        <a href="index.html">Home</a> |
        <a href="productspage.html">Products</a> |
        <a href="shoppage.html">Shop</a> |
        <a href="shopping cart and checkout.html">Cart</a> |
        <a href="events and news section.html">Events & News</a> |
        <a href="about.html">About</a> |
        <a href="enquiry.html">Enquiry</a> |
        <a href="contact.html">Contact</a> |
    </nav>
</header>

<div class="banner-container">
    <img src="ViweWave Images/Vertical ViweWave Banner.jpg" alt="ViweWave Banner">
</div>

<main style="max-width: 600px; margin: 0 auto; padding: 20px;">
    <section class="welcome-block" style="text-align: center; margin-bottom: 30px;">
        <h2>Have a general question? Drop us a message below! ✉️</h2>
    </section>

    <form id="contactForm" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label for="contactName" style="display: block; margin-bottom: 5px; font-weight: bold;">Full Name:</label>
            <input type="text" id="contactName" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bc13fe; background: transparent; color: inherit;">
            <span id="contactNameError" style="color: #ff007f; font-size: 0.85rem;"></span>
        </div>

        <div>
            <label for="contactEmail" style="display: block; margin-bottom: 5px; font-weight: bold;">Email Address:</label>
            <input type="email" id="contactEmail" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bc13fe; background: transparent; color: inherit;">
            <span id="contactEmailError" style="color: #ff007f; font-size: 0.85rem;"></span>
        </div>

        <div>
            <label for="contactMessage" style="display: block; margin-bottom: 5px; font-weight: bold;">Your Message:</label>
            <textarea id="contactMessage" required rows="5" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #bc13fe; background: transparent; color: inherit; resize: vertical;"></textarea>
            <span id="contactMessageError" style="color: #ff007f; font-size: 0.85rem;"></span>
        </div>

        <button type="submit" style="padding: 12px; background: #bc13fe; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">
            Send Message ✨
        </button>
        
        <div id="contactSuccessMessage" style="text-align: center; font-weight: bold; margin-top: 10px;"></div>
    </form>
</main>

<footer>
    <p>Follow us on social media for the latest updates:</p>
    <ul>
        <li><a href="https://facebook.com/viwewave" target="_blank">Facebook</a></li>
        <li><a href="https://instagram.com/viwewave" target="_blank">Instagram</a></li>
        <li><a href="https://twitter.com/viwewave" target="_blank">Twitter</a></li>
    </ul>
    <p>© 2026 ViweWave K-pop Store. All Rights Reserved.</p>
</footer>

</body>
</html>
